server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Azure LoadBalancer health probe endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"HEALTHY","component":"frontend-gateway"}';
    }

    # 1. User Service (PostgreSQL)
    location /api/auth/ {
        proxy_pass http://user-service:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Catalogue Service (MongoDB)
    location /api/catalogue/ {
        proxy_pass http://catalogue-service:3002/api/catalogue/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Cart Service (MongoDB)
    location /api/cart/ {
        proxy_pass http://cart-service:3003/api/cart/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Shipping Service (PostgreSQL)
    location /api/shipping/ {
        proxy_pass http://shipping-service:3004/api/shipping/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Order Service (PostgreSQL)
    location /api/orders/ {
        proxy_pass http://order-service:3005/api/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
