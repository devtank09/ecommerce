# =============================================================================
# deployment.yaml — CloudMart 5-Microservice E-Commerce + PostgreSQL + MongoDB
# Apply with: kubectl apply -f deployment.yaml -f service.yaml
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: cloudmart-ecommerce
  labels:
    app.kubernetes.io/part-of: cloudmart-aks
---
# PostgreSQL Relational Database (for user-service, order-service, shipping-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: cloudmart-ecommerce
  labels:
    app: postgres-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "cloudmart"
            - name: POSTGRES_PASSWORD
              value: "cloudmart_pass"
            - name: POSTGRES_DB
              value: "cloudmart_sql"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
# MongoDB NoSQL Document Store (for catalogue-service and cart-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  namespace: cloudmart-ecommerce
  labels:
    app: mongo-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
# Microservice 1: user-service (Backed by PostgreSQL)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cloudmart-ecommerce
  labels:
    app: user-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        tier: backend
    spec:
      containers:
        - name: user-service
          image: ${ACR_LOGIN_SERVER}/cloudmart/user-service:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgresql://cloudmart:cloudmart_pass@postgres-db:5432/cloudmart_sql"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Microservice 2: catalogue-service (Backed by MongoDB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
  namespace: cloudmart-ecommerce
  labels:
    app: catalogue-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogue-service
  template:
    metadata:
      labels:
        app: catalogue-service
        tier: backend
    spec:
      containers:
        - name: catalogue-service
          image: ${ACR_LOGIN_SERVER}/cloudmart/catalogue-service:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              value: "mongodb://mongo-db:27017/cloudmart_nosql"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
---
