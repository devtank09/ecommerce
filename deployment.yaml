---
# Frontend Gateway (Exposed via Azure LoadBalancer in service.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
  namespace: cloudmart-ecommerce
  labels:
    app: frontend-gateway
    tier: edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-gateway
  template:
    metadata:
      labels:
        app: frontend-gateway
        tier: edge
    spec:
      containers:
        - name: frontend-gateway
          image: ${ACR_LOGIN_SERVER}/cloudmart/frontend-gateway:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
